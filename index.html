<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horloge</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #ffffff;
      --surface: #f9f8f7;
      --border: #e6e5e3;
      --text: #2c2c2b;
      --muted: #7d7a75;
      --accent: #2783de;
      --accent-soft: #e5f2fc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #191919;
        --surface: #202020;
        --border: rgba(255, 255, 255, 0.2);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.65);
        --accent: #5e9fe8;
        --accent-soft: rgba(94, 159, 232, 0.14);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .clock-card {
      width: min(100%, 720px);
      min-height: 220px;
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 28px 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background:
        radial-gradient(circle at 18% 16%, var(--accent-soft), transparent 30%),
        linear-gradient(145deg, var(--canvas), var(--surface));
      box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
      text-align: center;
      overflow: hidden;
    }

    .label {
      margin: 0;
      font-size: clamp(14px, 2.4vw, 16px);
      line-height: 1.4;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .time {
      margin: 0;
      font-size: clamp(54px, 14vw, 112px);
      line-height: 0.92;
      font-weight: 750;
      letter-spacing: -0.065em;
      font-variant-numeric: tabular-nums;
    }

    .date {
      margin: 0;
      font-size: clamp(16px, 3vw, 22px);
      line-height: 1.35;
      color: var(--muted);
      font-weight: 500;
    }

    .dot {
      display: inline-block;
      width: 0.42em;
      text-align: center;
      color: var(--accent);
      animation: pulse 1s steps(1, end) infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }

    @keyframes pulse { 50% { opacity: 0.28; } }
  </style>
</head>
<body>
  <main class="clock-card" aria-label="Horloge en direct">
    <p class="label">Heure locale</p>
    <p class="time" aria-live="polite"><span id="hours">--</span><span class="dot">:</span><span id="minutes">--</span></p>
    <p class="date" id="date">Chargement…</p>
  </main>

  <script>
    const locale = 'fr-FR';
    const timeZone = 'Europe/Paris';
    const hours = document.getElementById('hours');
    const minutes = document.getElementById('minutes');
    const date = document.getElementById('date');

    function titleCaseFirst(value) {
      return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;
    }

    function updateClock() {
      const now = new Date();
      const timeParts = new Intl.DateTimeFormat(locale, {
        timeZone,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(now);

      hours.textContent = timeParts.find(part => part.type === 'hour')?.value ?? '--';
      minutes.textContent = timeParts.find(part => part.type === 'minute')?.value ?? '--';

      const formattedDate = new Intl.DateTimeFormat(locale, {
        timeZone,
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }).format(now);
      date.textContent = titleCaseFirst(formattedDate);
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
